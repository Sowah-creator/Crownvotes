
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrownVotes Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f5f9;margin:0;padding:20px;color:#222}
.container{max-width:650px;margin:20px auto;background:white;padding:22px;border-radius:12px;box-shadow:0 3px 15px #0001}
h1{color:#35206d}
input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:7px;font-size:16px}
input{border:1px solid #ccc}
button{background:#35206d;color:white;border:0;font-weight:bold}
button:disabled{opacity:.6}
.hidden{display:none}
.panel{background:#f5f2fc;padding:15px;margin:12px 0;border-radius:8px}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
#message{color:#a12626}
</style>
</head>
<body>
<div class="container">
<h1>CrownVotes Admin</h1>
<p>Administrator control panel</p>

<div id="login">
  <p id="message"></p›
<h2>Admin Login</h2>
  <p style="color:blue;font-weight:bold">ADMIN PAGE TEST</p>
  <p style="color:green;font-weight:bold">JAVASCRIPT TEST: <span id="jsTest">NOT RUNNING</span></p>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin email" required>
<input id="password" type="password" placeholder="Admin password" required>
<button type="submit">Login</button>
</form>
</div>

<div id="dashboard" class="hidden">
<h2>Admin Control Centre</h2>
<p id="welcome"></p>

<div class="panel">
<h3>Management Menu</h3>
<button onclick="showSection('overview')">Overview</button>
<button onclick="alert('Users clicked'); showSection('users')">Users</button>
<button onclick="showSection('organizers')">Organizers</button>
<button onclick="showSection('applications')">Applications</button>
<button onclick="showSection('events')">Events</button>
<button onclick="showSection('finance')">Finance</button>
<button onclick="showSection('payouts')">Payouts</button>
<button onclick="showSection('results')">Results</button>
<button onclick="showSection('audit-logs')">Audit Logs</button>
</div>

<div class="panel">
<h3 id="sectionTitle">Overview</h3>
<pre id="sectionContent">Loading...</pre>
<button id="refresh">Refresh Section</button>
</div>

<button id="logout">Logout</button>
</div>

<script>
const message = document.getElementById('message');
let token = localStorage.getItem('crownvotes_admin_token');

async function api(path, options={}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? {'Authorization': 'Bearer ' + token} : {}),
      ...(options.headers || {})
    }
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || 'Request failed');
  return data;
}

  async function showSection(section) {
    alert('Function reached: ' + section);
  const endpoints = {
    overview: '/api/admin/overview',
    users: '/api/admin/users',
    organizers: '/api/admin/applications',
    applications: '/api/admin/applications',
    events: '/api/admin/events',
    finance: '/api/admin/finance',
    payouts: '/api/admin/finance',
    results: '/api/admin/results',
    'audit-logs': '/api/admin/audit-logs'
  };

  const titles = {
    overview: 'Overview',
    users: 'Users',
    organizers: 'Organizers',
    applications: 'Organiser Applications',
    events: 'Events',
    finance: 'Finance',
    payouts: 'Payouts',
    results: 'Election Results',
    'audit-logs': 'Audit Logs'
  };

  const output = document.getElementById('sectionContent');
    alert('Panel found: ' + !!output);
  document.getElementById('sectionTitle').textContent =
    titles[section] || 'Admin Section';

  output.textContent = 'Loading...';

  try {
    alert('About to request: ' + endpoints[section]);
    const data = await api(endpoints[section]);
    alert('API request completed');
    console.log('SECTION DATA:', section, data);
    output.textContent = 'Section: ' + section + '\nEndpoint: ' + endpoints[section] + '\nResponse: ' + JSON.stringify(data, null, 2);
  } catch (error) {
    output.textContent = 'Error: ' + error.message;
  }
}
async function loadDashboard() {
  try {
    const user = await api('/api/me');

    if (!user || user.role !== 'admin') {
      throw new Error('This account is not an administrator account.');
    }

    document.getElementById('login').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');

    document.getElementById('welcome').textContent =
      'Logged in as ' + (user.email || 'Administrator');

    message.textContent = '';

    await showSection('overview');

  } catch (error) {
    token = null;
    localStorage.removeItem('crownvotes_admin_token');

    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');

    message.textContent = error.message;
  }
}


document.getElementById('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  alert('LOGIN BUTTON WORKS');
  message.style.color = 'blue';
message.textContent = 'Signing in...';

  try {
    const result = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });

    if (!result.token) throw new Error('Login did not return a token.');

    token = result.token;
    localStorage.setItem('crownvotes_admin_token', token);
    await loadDashboard();
  } catch (error) {
    message.textContent = error.message;
  }
});

document.getElementById('refresh').addEventListener('click', loadDashboard);

document.getElementById('logout').addEventListener('click', () => {
  token = null;
  localStorage.removeItem('crownvotes_admin_token');
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  message.textContent = 'You have logged out.';
});

if (token) loadDashboard();
  document.getElementById('jsTest').textContent = 'RUNNING';
</script>
</body>
</html>
