services:
  - type: web
    name: crownvotes
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: crownvotes-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: /opt/render/project/src/data/crownvotes.sqlite
      - key: PAYOUT_DATA_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PAYMENT_SECRET
        sync: false
